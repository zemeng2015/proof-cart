name: Repository hygiene

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  whitespace:
    name: Tracked-file whitespace (not application tests)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check all tracked changes against an empty tree
        shell: bash
        run: git diff --check "$(git hash-object -t tree /dev/null)" HEAD
